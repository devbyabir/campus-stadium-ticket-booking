services:
  - type: web
    name: campus-stadium-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run start:deploy
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: disable
      - key: DATABASE_URL
        fromDatabase:
          name: campus-stadium-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
databases:
  - name: campus-stadium-db
    plan: free
